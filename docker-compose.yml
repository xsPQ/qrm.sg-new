# =========================================================================
# docker-compose.yml — Shared base config (used by both dev and prod)
# =========================================================================
# Dev:  docker compose up          (auto-merges docker-compose.override.yml)
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =========================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qrm-sg-app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qrm-network

  db:
    image: postgres:16-alpine
    container_name: qrm-sg-db
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_DATABASE:-qrm_sg}
      - POSTGRES_USER=${DB_USERNAME:-qrm}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qrm} -d ${DB_DATABASE:-qrm_sg}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - qrm-network

volumes:
  pg-data:
    driver: local
  qr-storage:
    driver: local

networks:
  qrm-network:
    driver: bridge
