# =============================================================================
# nginx reverse proxy for qrm.sg (DEV-858 deployment stack).
#
# Serves the Laravel public/ directory and proxies PHP to the `app` php-fpm
# service on :9000. Listens on :80; docker-compose maps it to host :8080 so the
# smoke gate (HEALTH_URL=http://127.0.0.1:8080/health) and the public site
# (qrm.sg:8080) share one endpoint.
#
# The SCRIPT_FILENAME / DOCUMENT_ROOT point at /var/www/public, which nginx
# reads from the shared `webroot` named volume (seeded from the app image).
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/public;
    index index.php;

    # Laravel's front controller pattern: let real files (built Vite assets,
    # favicons, storage symlink) be served directly, everything else goes to
    # index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Compiled frontend assets never change for a given path -> immutable cache.
    location = /build/ {
        return 404;
    }
    location ~* /build/.+ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Standard Laravel security: never expose dotfiles or env files.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # FastCGI to php-fpm. www-data ownership + writable storage/framework/views
    # is established by the app entrypoint (DEV-858) so Blade compilation and
    # tempnam() succeed here.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        include       fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }
}
