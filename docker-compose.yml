# =============================================================================
# qrm.sg production-style Docker Compose stack (DEV-858).
#
# Six services, matching docs/operations/docker-build-gate.md §8:
#   nginx     - :8080 -> Laravel public/ + FastCGI proxy to app:9000
#   app       - php:8.3-fpm-alpine production image (this repo's docker/app)
#   worker    - queue worker (redis), same image, drops to www-data
#   scheduler - schedule:work runner, same image, drops to www-data
#   postgres  - primary database
#   redis     - cache / session / queue store
#
# WHY THIS FILE: the deployment was previously hand-managed on the host, which
# is how a root-owned bind-mount on storage/ slipped in and caused HTTP 500 on
# every Blade page (tempnam() failed because storage/framework/views was not
# writable by www-data). Committing a reproducible stack removes that footgun.
# The app/worker/scheduler containers run docker/app/entrypoint.sh, which
# re-normalises storage/ + bootstrap/cache ownership to www-data on EVERY start
# (self-heal), so the 500 cannot recur regardless of how storage is mounted.
#
# Usage:
#   docker compose build app
#   docker compose up -d
#   curl -f http://127.0.0.1:8080/up        # Laravel health route
#
# Secrets: copy .env.example to .env and fill APP_KEY, DB_PASSWORD, etc.
# Compose only wires *service-to-service* hosts; all credentials come from .env.
#
# Re-seed caveat: the `webroot` named volume is seeded from the app image on
# first creation only. After rebuilding the app image with new code/assets,
# remove ONLY the webroot volume (NOT db-data/redis-data — that would wipe the
# production database), then recreate the stack. `scripts/deploy-qrm-sg.sh`
# does this correctly. Never run `docker compose down -v` on this stack: it
# removes ALL named volumes and destroys PostgreSQL + Redis data.
# =============================================================================

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-qrm}
      POSTGRES_USER: ${DB_USERNAME:-qrm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qrm} -d ${DB_DATABASE:-qrm}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    image: qrm-sg:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Service-to-service hosts (override whatever .env points at).
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Shared webroot so nginx can read public/; app entrypoint owns storage.
      - webroot:/var/www
    networks:
      - default

  worker:
    image: qrm-sg:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    # Runs as root -> entrypoint chowns shared storage then drops to www-data
    # before exec, so the worker never leaves root-owned view/cache files.
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=5", "--sleep=3"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - webroot:/var/www
    networks:
      - default

  scheduler:
    image: qrm-sg:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    # schedule:work runs the in-process cron loop as www-data (entrypoint drop).
    command: ["php", "artisan", "schedule:work", "--verbose"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - webroot:/var/www
    networks:
      - default

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - webroot:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default

volumes:
  webroot:
  db-data:
  redis-data:

networks:
  default:
