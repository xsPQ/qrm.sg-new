services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qrm-sg-app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/qrm.sg
      - qr-storage:/var/www/qrm.sg/storage/app/private
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-qrm_sg}
      - DB_USERNAME=${DB_USERNAME:-qrm}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=127.0.0.1
      - REDIS_PASSWORD=null
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - STRIPE_KEY=${STRIPE_KEY:-}
      - STRIPE_SECRET=${STRIPE_SECRET:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - STRIPE_PRICE_BUSINESS=${STRIPE_PRICE_BUSINESS:-}
    restart: unless-stopped
    networks:
      - qrm-network

  db:
    image: postgres:16-alpine
    container_name: qrm-sg-db
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_DATABASE:-qrm_sg}
      - POSTGRES_USER=${DB_USERNAME:-qrm}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qrm} -d ${DB_DATABASE:-qrm_sg}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - qrm-network

volumes:
  pg-data:
    driver: local
  qr-storage:
    driver: local

networks:
  qrm-network:
    driver: bridge
